<aside class="sidebar" data-url="{{ request.path }}">
  <div class="sidebar__section">
    <div class="sidebar__title">Меню</div>
    <a class="navitem" data-match="calendar" href="{% url 'calendar' %}">
      <i class="material-icons">event</i>
      <span>Зайнятість переговорних</span>
    </a>
  </div>
  {% if user.is_staff %}
    <div class="sidebar__section">
      <div class="sidebar__title">Адміністрування</div>
      <a class="navitem" data-match="admin_rooms" href="{% url 'admin_rooms' %}">
        <i class="material-icons">meeting_room</i>
        <span>Переговорні</span>
      </a>
      <a class="navitem" data-match="admin_users" href="{% url 'admin_users' %}">
        <i class="material-icons">people</i>
        <span>Користувачі</span>
      </a>
    </div>
  {% endif %}
</aside>
<script>
  (function () {
    const sidebar = document.querySelector(".sidebar");
    if (!sidebar) return;

    const path = sidebar.getAttribute("data-url") || "";

    const setActive = (match) => {
      const el = sidebar.querySelector(`.navitem[data-match="${match}"]`);
      if (el) el.classList.add("active");
    };

    if (path.startsWith("/calendar/")) {
      setActive("calendar");
      return;
    }

    if (path.startsWith("/admin/rooms/")) {
      setActive("admin_rooms");
      return;
    }

    if (path.startsWith("/admin/users/")) {
      setActive("admin_users");
      return;
    }
  })();
</script>
